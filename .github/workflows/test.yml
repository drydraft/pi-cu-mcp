name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run portable tests
        run: python -m pytest -q tests/test_controller.py tests/test_input.py
      - name: Compile the server
        run: python -m compileall -q windows_mcp server.py
